<!DOCTYPE html>
<html>

<head>

<title>

Customer Login

</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="login-box">

<h1>

The Fav' Maverick Studio

</h1>

<p>

Login to view orders,
profile and tracking

</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter Password">

<button
type="button"
onclick="togglePassword()">

👁

</button>

</div>

<button
onclick="signup()">

Create Account

</button>

<button
onclick="login()">

Login

</button>

<p>

New customer?
Create account first

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>

</body>

</html>
