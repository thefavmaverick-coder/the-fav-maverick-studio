<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Orders</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-orders">

<div class="admin-header">

<h1>📦 Orders Dashboard</h1>

<button
class="admin-btn"
onclick="loadOrders()">

🔄 Refresh

</button>

</div>

<div class="stats">

<div class="stat-card">

<h2 id="total-orders">
0
</h2>

<p>
Total Orders
</p>

</div>

<div class="stat-card">

<h2 id="total-sales">
₹0
</h2>

<p>
Total Sales
</p>

</div>

</div>

<input
type="text"
id="search-order"
placeholder="🔍 Search Order ID..."
onkeyup="searchOrders()">

<div id="orders-container">

Loading Orders...

</div>

</div>

<script src="admin-orders.js"></script>

</body>
</html>
