<!DOCTYPE html>
<html>

<head>

<title>

My Profile

</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="profile-box">

<h1>

👤 My Profile

</h1>

<input
type="text"
id="full_name"
placeholder="Full Name">

<input
type="text"
id="phone"
placeholder="Phone">

<textarea
id="address"
placeholder="Address">

</textarea>

<input
type="text"
id="city"
placeholder="City">

<input
type="text"
id="state"
placeholder="State">

<input
type="text"
id="pincode"
placeholder="Pincode">

<button
onclick="saveProfile()">

Save Profile

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="profile.js"></script>

</body>

</html>
