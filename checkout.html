<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta    ="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="stylesheet"
href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="checkout-page">

    <h1>Checkout</h1>

    <div class="checkout-container">

       <!-- ADDRESS -->

<div class="checkout-form">

    <h2>Delivery Address</h2>

    <input type="text"
    id="name"
    placeholder="Name">

    <input type="tel"
    id="phone"
    placeholder="Phone Number">

    <input type="email"
    id="email"
    placeholder="Email Address">

    <input type="text"
    id="door"
    placeholder="Door / Flat No">

    <input type="text"
    id="street"
    placeholder="Street Name">

    <input type="text"
    id="area"
    placeholder="Area / Locality">

    <input type="text"
    id="landmark"
    placeholder="Nearby Landmark">

    <textarea
    id="address"
    placeholder="Full Delivery Address">
    </textarea>

    <input type="text"
    id="city"
    placeholder="City">

    <input type="text"
    id="district"
    placeholder="District">

    <input type="text"
    id="state"
    placeholder="State">

    <input type="text"
    id="country"
    placeholder="Country">

    <input type="text"
    id="pincode"
    placeholder="Pincode">

</div>

        <!-- ORDER SUMMARY -->

        <div class="order-summary">

            <h2>Your Order</h2>

            <div id="checkout-items">

            </div>

            <h3>
                Total :
                ₹<span id="checkout-total">
                0
                </span>
            </h3>
            <h2 class="payment-title">

Select Payment Method

</h2>

<div class="payment-methods">

    <label class="payment-option">

        <input type="radio"
        name="payment"
        value="COD"
        checked>

        Cash on Delivery

    </label>

    <label class="payment-option">

        <input type="radio"
        name="payment"
        value="UPI">

        UPI Payment

    </label>

</div>

<div id="upi-box"
style="display:none;">

    <h3>Pay Using UPI</h3>

    <p>
    UPI ID :
    ambir3007-1@okhdfcbank
    </p>

    <img
    src="images/upi-qr.png"
    class="upi-qr">

</div>

           <button onclick="placeOrder()">

Place Order

</button>

        </div>

    </div>

</div>

<script src="checkout.js"></script>

</body>

</html>
