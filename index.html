<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>The_Fav'Maverick_Studio</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        The_Fav'Maverick_Studio
    </div>

    <nav>

        <a href="#">Home</a>

        <a href="#products">
            Products
        </a>

        <a href="#"
        onclick="toggleCart(); return false;">

            Cart 🛒
            (<span id="cart-count">0</span>)

        </a>

    </nav>

</header>

<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <h1>
            Turn Your Memories Into Art ✨
        </h1>

        <p>
            Premium custom posters,
            polaroids and aesthetic gifts.
        </p>

        <button onclick="scrollProducts()">
            Shop Now
        </button>

    </div>

</section>

<!-- PRODUCTS -->

<section id="products">

    <div class="section-title">

        <h2>Trending Products</h2>

    </div>
    <!-- SEARCH + FILTER -->

<div class="filters">

    <input
    type="text"
    id="search"
    placeholder="Search products..."
    onkeyup="filterProducts()">

    <select id="size-filter"
    onchange="filterProducts()">

        <option value="All">
            All Sizes
        </option>

        <option value="A4">A4</option>

        <option value="A5">A5</option>

        <option value="A6">A6</option>

    </select>

</div>

    <section class="products"
    id="product-list">

    </section>

</section>

<!-- CART -->

<div id="cart"
class="cart">

    <div class="cart-top">

        <h2>Your Cart</h2>

        <button class="close-btn"
        onclick="toggleCart()">
            ✖
        </button>

    </div>

    <div id="cart-items"></div>

    <h3>
        Total: ₹<span id="total">0</span>
    </h3>

   <button class="checkout-btn"
onclick="goToCheckout()">
Checkout
</button>

</div>

<!-- OVERLAY -->

<div id="overlay"
class="overlay"
onclick="toggleCart()">
</div>

<!-- PRODUCT POPUP -->

<div id="popup"
class="popup">

   <div class="popup-content">

        <span class="close-popup"
        onclick="closePopup()">
        ✖
        </span>

        <img id="popup-img">

        <div class="popup-details">

            <h2 id="popup-title"></h2>

            <p id="popup-price"></p>

            <p id="popup-desc"></p>

            <button id="popup-btn">

                Add To Cart
            </button>

        </div>

    </div>

</div>


<script src="products.js"></script>

<script src="script.js"></script>

</body>
</html>
